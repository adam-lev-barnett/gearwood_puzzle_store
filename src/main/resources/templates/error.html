<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/Error.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="error-container card">
            <h1>Something went wrong</h1>

            <!-- ${errorMessage} : friendly message set by your controller/handler.
                 Never render raw exceptions or stack traces here (spec 13). -->
            <p th:text="${errorMessage} ?: 'An unexpected error occurred. Please try again.'">
                Something went wrong. Please try again.
            </p>

            <a th:href="@{/home}" class="action-button">Return Home</a>
        </div>
    </main>
</body>
</html>
