<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>Error</title>
    <link rel="stylesheet" th:href="@{/css/Error.css}">
</head>
<body>
    <main layout:fragment="content">
        <section class="error-page">
            <div class="error-art">
                <img th:src="@{/BusinessImages/error-image.png}"
                     alt="A puzzle with a missing piece" />
            </div>

            <div class="error-content card">
                <!-- Big, glanceable status code; defaults set by GlobalExceptionHandler. -->
                <span class="error-status" th:text="${status} ?: 'Oops'">404</span>
                <h1 class="error-title">Something went wrong</h1>

                <!-- Friendly, non-technical message (spec 13: no raw stack traces). -->
                <p class="error-message">
                    We couldn't quite put this page together. A piece may be missing
                    or out of place.
                </p>

                <a th:href="@{/home}" class="action-button">Return Home</a>
            </div>
        </section>
    </main>
</body>
</html>
