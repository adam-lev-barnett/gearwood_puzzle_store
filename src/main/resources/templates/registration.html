<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/Registration.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="form-container">
            <h1>Create Account</h1>

            <form class="register-form form-card" th:action="@{/register}" method="post">
                <!-- ${error} : validation/duplicate-account message set by the controller -->
                <p class="error-message" th:if="${error}" th:text="${error}"></p>

                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>

                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" minlength="6" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required>

                <button type="submit" class="submit-button">Create Account</button>
            </form>

            <p class="form-footer">Already have an account? <a th:href="@{/login}">Login</a></p>
        </div>
    </main>
</body>
</html>
