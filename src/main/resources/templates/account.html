<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>My Account</title>
    <link rel="stylesheet" th:href="@{/css/Account.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="account-container">
            <h1>My Account</h1>

            <div class="account-grid">
                <!-- ${user} : UserDto for the logged-in user -->
                <section class="profile-info card">
                    <h2>Profile Information</h2>
                    <p><span class="label">First Name:</span> <span th:text="${user?.firstName()}"></span></p>
                    <p><span class="label">Last Name:</span> <span th:text="${user?.lastName()}"></span></p>
                    <p><span class="label">Email:</span> <span th:text="${user?.email()}"></span></p>
                    <p><span class="label">Role:</span> <span th:text="${user?.roles()}"></span></p>
                </section>

                <section class="account-actions card">
                    <h2>Account Actions</h2>
                    <a th:href="@{/account/edit}" class="action-button">Edit Profile</a>
                    <a th:href="@{/account/password}" class="action-button">Change Password</a>
                    <a th:href="@{/cart}" class="action-link">View Cart</a>
                </section>
            </div>

            <!-- ${orders} : List of the user's orders (brief summary; full list on /account/orders) -->
            <section class="order-history card">
                <h2>Order History</h2>
                <div th:each="order : ${orders}" class="order-summary-row">
                    <div>
                        <p class="order-number">Order # <span th:text="${order.orderNumber()}"></span></p>
                        <p class="order-status">Status: <span th:text="${order.orderStatus()}"></span></p>
                        <a th:href="@{/account/orders/{num}(num=${order.orderNumber()})}">View Details</a>
                    </div>
                    <div class="order-meta">
                        <span class="order-date" th:text="${order.orderDateTime()}"></span>
                        <span class="order-total" th:text="${'$' + order.totalAmount()}"></span>
                    </div>
                </div>
                <p th:if="${#lists.isEmpty(orders)}" class="empty-state">You have no orders yet.</p>
            </section>
        </div>
    </main>
</body>
</html>
