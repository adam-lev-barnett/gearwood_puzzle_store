<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>Order Confirmed</title>
    <link rel="stylesheet" th:href="@{/css/CheckoutSuccess.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="success-container card">
            <h1>Thank you for your order!</h1>
            <p>Your order has been placed successfully.</p>

            <!-- ${orderNumber} : application-defined order number (e.g. ORD-7E9F7591) -->
            <p class="order-number">Order Number: <span th:text="${finalOrderDetails.orderNumber()}"></span></p>

            <div class="success-actions">
                <a th:href="@{/products/catalog}" class="action-button">Continue Shopping</a>
                <a th:href="@{/account}" class="action-link">My Account</a>
            </div>
        </div>
    </main>
</body>
</html>
