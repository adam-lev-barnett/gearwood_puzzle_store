<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/MainLayout}" lang="">
<head>
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/ProductCatalog.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/ProductCard.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="catalog-container">
            <h1>Product Catalog</h1>
            <form method="get" th:action="@{/products/catalog}" id="search-form">
                <label>
                    <input type="text" name="keyword" placeholder="Search by name..."
                           th:value="${keyword}">
                </label>
                <label>
                    <select name="category">
                        <option value="">All Categories</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == selectedCategory}">
                        </option>
                    </select>
                </label>
                <label>
                    <select name="difficulty">
                        <option value="">All Difficulties</option>
                        <option th:each="diff : ${difficulties}"
                                th:value="${diff}"
                                th:text="${diff}"
                                th:selected="${diff == selectedDifficulty}">
                        </option>
                    </select>
                </label>
                <label>
                    <input type="number" name="minPrice" placeholder="Min price" step="1" min="0"
                           th:value="${minPrice}">
                </label>
                <label>
                    <input type="number" name="maxPrice" placeholder="Max price" step="1" min="0"
                           th:value="${maxPrice}">
                </label>
                <button type="submit">Search</button>
                <a th:href="@{/products/catalog}">Clear</a>
            </form>

            <div class="product-grid">
                <th:block th:each="product : ${products}">
                    <div th:replace="~{fragments/productCard ::
                        productCard(
                            ${product.productCode()},
                            ${product.imgSrc()},
                            ${product.name()},
                            ${product.manufacturer()},
                            ${product.category()},
                            ${product.difficulty()},
                            ${product.price()},
                            ${product.shortDescription()})}">
                    </div>
                </th:block>
                <p th:if="${#lists.isEmpty(products)}" class="empty-state">No products found.</p>
            </div>
        </div>
    </main>
</body>
</html>
