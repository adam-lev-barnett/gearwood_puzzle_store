<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/MainLayout}">
<head>
    <title>Change Password</title>
    <link rel="stylesheet" th:href="@{/css/ChangePassword.css}">
</head>
<body>
    <main layout:fragment="content">
        <div class="form-container">
            <a th:href="@{/account}" class="back-link">&larr; Back to Account</a>
            <h1>Change Password</h1>

            <!-- ${error} : wrong current password / mismatch / too short, set by controller -->
            <p class="form-error" th:if="${error}" th:text="${error}"></p>

            <form class="change-password-form form-card" th:action="@{/account/password}" method="post">
                <label for="currentPassword">Current Password</label>
                <input type="password" id="currentPassword" name="currentPassword" required>

                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" minlength="6" required>

                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" required>

                <div class="form-actions">
                    <button type="submit" class="submit-button">Update Password</button>
                    <a th:href="@{/account}" class="cancel-link">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
