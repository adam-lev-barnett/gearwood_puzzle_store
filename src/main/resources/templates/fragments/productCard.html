<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>

<div th:fragment="productCard(productCode, productImg, productName, manufacturer, category, difficulty, price, description)"
     class="product-card">
    <a th:href="@{/products/{code}(code=${productCode})}">
        <img class="card-image"
             th:src="${productImg != null ? productImg : '/product-images/default.jpg'}"
             th:alt="${productName}"/>
        <div class="card-body">
            <div class="card-tags">
                <span class="card-tag" th:text="${category}"></span>
                <span class="card-tag" th:text="${difficulty}"></span>
            </div>
            <h3 th:text="${productName}"></h3>
            <p class="card-description" th:text="${description}"></p>
            <div class="card-footer">
                <span class="card-price" th:text="${'$' + price}"></span>
                <span class="card-manufacturer" th:text="${manufacturer}"></span>
            </div>
        </div>
    </a>
</div>

</body>
</html>
