<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title></title>
</head>
<body>

<div th:fragment="productCard(productCode, productImg, productName, numPieces, category, difficulty, price, description)"
     class="product-card">
    <a th:href="@{/products/{code}(code=${productCode})}">
        <img class="card-image"
             th:src="${productImg != null ? productImg : '/product-images/default.jpg'}"
             th:alt="${productName}"/>
        <div class="card-body">
            <div class="card-tags">
                <span class="card-tag" th:text="${category.displayName}"></span>
                <span class="card-tag" th:text="${difficulty}"></span>
            </div>
            <h3 th:text="${productName}"></h3>
            <p class="card-description" th:text="${description}"></p>
            <div class="card-footer">
                <span class="card-price" th:text="${'$' + price}"></span>
                <span class="card-manufacturer" th:text="${numPieces} + ' Pieces'"></span>
            </div>
        </div>
    </a>

    <!-- Admin-only actions, kept OUTSIDE the card's <a> (a form can't be nested in a link). -->
    <div sec:authorize="hasRole('ADMIN')" class="card-admin-actions">
        <a th:href="@{/products/{code}/edit(code=${productCode})}" class="card-edit-btn">Edit</a>
        <form th:action="@{/products/{code}/delete(code=${productCode})}" method="post"
              onsubmit="return confirm('Delete this product? If it is in a cart or past order it will be deactivated instead.');">
            <button type="submit" class="card-delete-btn">Delete</button>
        </form>
    </div>
</div>

</body>
</html>
